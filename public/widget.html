<!DOCTYPE html>
<html lang="ro" class="map-widget">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>Harta avertizări</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }
    body { font-family: Arial, Helvetica, sans-serif; }
    #map, #map.leaflet-container {
      width: 100%; height: 100%; min-height: 0;
      background: transparent !important;
      background-color: transparent !important;
      cursor: default;
    }
    .leaflet-container,
    .leaflet-pane,
    .leaflet-map-pane,
    .leaflet-overlay-pane,
    .leaflet-shadow-pane,
    .leaflet-marker-pane,
    .leaflet-tooltip-pane,
    .leaflet-tile-pane {
      background: transparent !important;
    }
    .leaflet-control-container { display: none !important; }
    .district-label,
    .city-label {
      background: transparent !important; border: none !important; box-shadow: none !important;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px; font-weight: 700; color: #14532d;
      text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
      pointer-events: none;
    }
    .city-label { font-weight: 600; }
    @media (max-width: 420px) {
      .district-label, .city-label { font-size: 7px !important; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="/js/district-codes.js"></script>
  <script src="/js/env-stations.js?v=20261009x2"></script>
  <script src="/js/models/warnings.js?v=20261009env"></script>
  <script src="/js/controllers/public-map.js?v=20261009soft2"></script>
</body>
</html>
