<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autentificare — Administrare</title>
  <link rel="stylesheet" href="/css/style.css?v=20261015purple" />
  <!-- Tailwind must load before tailwind.config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>
</head>
<body>
  <script>
    if (new URLSearchParams(location.search).get('next') === '/admin/environmental') {
      document.body.classList.add('kind-env');
    }
    if (new URLSearchParams(location.search).get('next') === '/admin/hydro') {
      document.body.classList.add('kind-hydro');
    }
  </script>
  <section id="login-view" class="active">
    <form class="login-card" id="login-form">
      <h1>Administrare</h1>
      <p id="login-subtitle">Avertizări Meteorologice</p>
      <label>
        Login
        <input type="text" id="login-user" autocomplete="username" required>
      </label>
      <label>
        Parolă
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="login-error"></div>
      <button type="submit" class="btn login-submit">Intră</button>
    </form>
  </section>

  <script>
    const next = new URLSearchParams(location.search).get('next');
    const LOGIN_KIND = next === '/admin/environmental'
      ? 'env'
      : next === '/admin/hydro'
        ? 'hydro'
        : next === '/admin/full'
          ? 'full'
          : 'meteo';
    const EDITOR_URL = LOGIN_KIND === 'env'
      ? '/admin/environmental'
      : LOGIN_KIND === 'hydro'
        ? '/admin/hydro'
        : '/admin';
    if (LOGIN_KIND === 'env') {
      document.getElementById('login-subtitle').textContent = 'Avertizări de mediu';
    } else if (LOGIN_KIND === 'hydro') {
      document.getElementById('login-subtitle').textContent = 'Avertizări hidrologice';
    } else if (LOGIN_KIND === 'full') {
      document.getElementById('login-subtitle').textContent = 'Administrare completă';
    }

    // Already authenticated → open the admin list
    (async () => {
      try {
        const res = await fetch('/api/me');
        const data = res.ok ? await res.json() : null;
        if (data?.ok && data.kind === LOGIN_KIND) window.location.replace(EDITOR_URL);
      } catch {}
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user     = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;
      const error    = document.getElementById('login-error');
      error.textContent = '';

      try {
        const res  = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            user,
            password,
            kind: LOGIN_KIND,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = EDITOR_URL;
        } else {
          error.textContent = data.error || 'Login sau parolă incorectă';
        }
      } catch {
        error.textContent = 'Eroare de conexiune';
      }
    });
  </script>
</body>
</html>
